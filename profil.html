<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — JEJAKRUTE</title>
<meta name="description" content="Profil pendaki JEJAKRUTE dari server yang sama dengan aplikasi: postingan, pengikut, lencana, dan tautan sosial.">
<link rel="icon" href="assets/logo/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="manifest" href="assets/logo/site.webmanifest">
<meta name="theme-color" content="#17191C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/member.css">
</head>
<body data-member-page="profil">
<div data-member-shell></div>

<main class="member-main" data-member-main hidden>
  <div id="profileRoot"><p class="loading">Memuat profil dari server…</p></div>
</main>

<div class="msheet-ov" id="editSheet" hidden>
  <div class="msheet" role="dialog" aria-modal="true" aria-label="Edit Profil">
    <div class="msheet-head"><h3>Edit Profil</h3><button class="msheet-x" type="button" data-close-sheet aria-label="Tutup">✕</button></div>
    <form class="member-form" id="editProfileForm" style="margin-top:4px">
      <div class="form-grid"><div><label for="editNama">Nama</label><input id="editNama" maxlength="60" required></div>
      <div><label for="editUsername">Username</label><input id="editUsername" maxlength="24" required></div></div>
      <div><label for="editBio">Bio</label><textarea id="editBio" maxlength="500"></textarea></div>
      <div class="form-grid"><div><label for="editInstagram">Instagram</label><input id="editInstagram" maxlength="160" placeholder="username, @username, atau URL"></div>
      <div><label for="editTiktok">TikTok</label><input id="editTiktok" maxlength="160" placeholder="username, @username, atau URL"></div></div>
      <div class="form-grid"><div><label for="editAvatar">Foto profil baru</label><input id="editAvatar" type="file" accept="image/*"></div>
      <div><label for="editCover">Foto sampul baru</label><input id="editCover" type="file" accept="image/*"></div></div>
      <div class="form-actions"><button class="btn" type="submit">Simpan Profil</button><button class="btn plain" type="button" data-close-sheet>Batal</button><span class="small muted" id="editMsg"></span></div>
    </form>
  </div>
</div>

<div class="msheet-ov" id="followSheet" hidden>
  <div class="msheet" role="dialog" aria-modal="true" aria-label="Daftar pengikut">
    <div class="msheet-head"><h3 id="followSheetTitle">Pengikut</h3><button class="msheet-x" type="button" data-close-sheet aria-label="Tutup">✕</button></div>
    <div class="follow-list" id="followList"><p class="loading">Memuat dari server…</p></div>
  </div>
</div>

<section class="member-lock" data-member-lock hidden></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/auth.js?v=20261027-4"></script>
<script src="assets/member.js"></script>
<script>
(function () {
  "use strict";
  var K = window.MemberKit;
  var root = document.getElementById("profileRoot");
  var params = new URLSearchParams(location.search);
  var editSheet = document.getElementById("editSheet");
  var followSheet = document.getElementById("followSheet");
  var currentProfile = null, currentBadges = [], currentPosts = [], activeTab = "postingan";

  function socialUrl(value, platform) {
    if (!value) return "";
    var v = String(value).trim();
    if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    var clean = v.replace(/^@+/, "").replace(/\/$/, "");
    if (platform === "instagram") return "https://instagram.com/" + clean.replace(/^instagram\.com\//i, "");
    if (platform === "tiktok") return "https://tiktok.com/@" + clean.replace(/^tiktok\.com\/@?/i, "");
    return v;
  }
  function socialLabel(value, platform) {
    if (!value) return "";
    var v = String(value).trim();
    if (/^https?:\/\//i.test(v)) {
      v = v.replace(/^https?:\/\//i, "").replace(/^www\./i, "");
      if (platform === "instagram") v = v.replace(/^instagram\.com\//i, "");
      if (platform === "tiktok") v = v.replace(/^tiktok\.com\//i, "");
    }
    return v.charAt(0) === "@" ? v : "@" + v.replace(/^@+/, "");
  }
  function tileHTML(post) {
    var photos = K.photoItems(post);
    var badges = "";
    if (post.jenis === "foto" && photos.length > 1) {
      badges = '<span class="tile-badges"><span class="tile-badge">' + K.icons.multi + K.fmtNum(photos.length) + "</span></span>";
    }
    var inner;
    if (post.jenis === "foto" && photos.length) {
      inner = '<img src="' + K.esc(K.mediaUrl(photos[0].path)) + '" alt="" loading="lazy">';
    } else if (post.jenis === "gpx") {
      inner = '<span class="tile-replay"><span class="rp-play">' + K.icons.play + '</span>Replay</span>';
    } else if (post.jenis === "video") {
      var v = K.mediaItems(post)[0];
      inner = v ? '<video preload="metadata" src="' + K.esc(K.mediaUrl(v.path)) + '"></video>' : '<span class="tile-text">Video</span>';
    } else {
      inner = '<span class="tile-text">' + K.esc(post.caption || "Postingan") + "</span>";
    }
    return '<a class="post-tile" href="postingan.html?id=' + encodeURIComponent(post.id) + '">' + inner + badges + "</a>";
  }
  function openSheet(el) { el.hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheets() {
    [editSheet, followSheet].forEach(function (el) { el.hidden = true; });
    document.body.style.overflow = "";
  }
  document.querySelectorAll("[data-close-sheet]").forEach(function (b) {
    b.addEventListener("click", closeSheets);
  });
  [editSheet, followSheet].forEach(function (el) {
    el.addEventListener("click", function (e) { if (e.target === el) closeSheets(); });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheets(); });

  async function mulai() {
    var ctx = await K.ready();
    if (!ctx) return;
    var c = ctx.client, me = ctx.session.user.id;

    async function countEq(table, column, value) {
      var res = await c.from(table).select(column, { count: "exact", head: true }).eq(column, value);
      if (res.error) throw res.error;
      return res.count || 0;
    }
    async function resolveProfile() {
      var q = c.from("profiles").select("*");
      if (params.get("u")) q = q.eq("username", params.get("u"));
      else if (params.get("id")) q = q.eq("id", params.get("id"));
      else q = q.eq("id", me);
      var res = await q.single();
      if (res.error) throw res.error;
      return res.data;
    }
    async function openFollowList(kind, profileId) {
      var title = document.getElementById("followSheetTitle");
      var list = document.getElementById("followList");
      title.textContent = kind === "pengikut" ? "Pengikut" : "Mengikuti";
      list.innerHTML = '<p class="loading">Memuat dari server…</p>';
      openSheet(followSheet);
      try {
        var res = kind === "pengikut"
          ? await c.from("follows").select("pengikut").eq("diikuti", profileId)
          : await c.from("follows").select("diikuti").eq("pengikut", profileId);
        if (res.error) throw res.error;
        var ids = (res.data || []).map(function (r) { return kind === "pengikut" ? r.pengikut : r.diikuti; });
        if (!ids.length) { list.innerHTML = '<div class="empty">Belum ada data di server.</div>'; return; }
        var people = await K.profilesByIds(ids);
        list.innerHTML = ids.map(function (id) {
          var p = people.get(id) || { id: id, nama: "Pendaki JEJAKRUTE" };
          return '<a class="follow-row" href="' + K.esc(K.profileLink(p)) + '">' + K.avatarHTML(p, "small", ctx.session.user) +
            '<span class="grow"><span class="fname">' + K.nameHTML(p) + '</span><br><span class="funame">' + K.esc(K.usernameLabel(p)) + "</span></span></a>";
        }).join("");
      } catch (err) {
        list.innerHTML = '<div class="empty error">Daftar gagal dimuat: ' + K.esc(err.message || err) + "</div>";
      }
    }
    function tabContentHTML(p, own) {
      if (activeTab === "lencana") {
        var gunung = currentBadges.length
          ? '<div class="badge-list">' + currentBadges.map(function (b) {
              return '<span class="badge-chip">' + K.esc(b.lokasi_nama || b.lokasi_id || "Lokasi") + (b.jumlah ? " · " + K.fmtNum(b.jumlah) + "×" : "") + "</span>";
            }).join("") + "</div>"
          : '<div class="empty">Belum ada Lencana Gunung yang tercatat di server untuk profil ini.</div>';
        var terpasang = K.badgeLabels(p);
        return '<div class="badge-sec"><h3>Lencana Gunung</h3>' + gunung +
          (terpasang.length ? '<h3 style="margin-top:18px">Lencana Terpasang</h3><div class="badge-list">' + terpasang.map(function (b) { return '<span class="badge-chip">' + K.esc(b) + "</span>"; }).join("") + "</div>" : "") +
          "</div>";
      }
      if (!currentPosts.length) return '<div class="empty" style="margin-top:12px">Belum ada postingan tampil dari profil ini.</div>';
      return '<div class="post-grid">' + currentPosts.map(tileHTML).join("") + "</div>";
    }
    async function loadProfile() {
      root.innerHTML = '<p class="loading">Memuat profil dari server…</p>';
      var p = await resolveProfile();
      currentProfile = p;
      var own = p.id === me;
      var counts = await Promise.all([
        countEq("posts", "user_id", p.id),
        countEq("follows", "diikuti", p.id),
        countEq("follows", "pengikut", p.id)
      ]);
      var badgesRes = await c.from("user_badges").select("*").eq("user_id", p.id).order("lokasi_nama", { ascending: true });
      if (badgesRes.error) throw badgesRes.error;
      currentBadges = badgesRes.data || [];
      var followState = null;
      if (!own) {
        var fr = await c.from("follows").select("pengikut,diikuti").eq("pengikut", me).eq("diikuti", p.id).maybeSingle();
        if (fr.error) throw fr.error;
        followState = !!fr.data;
      }
      var postsQuery = c.from("posts").select("*").eq("user_id", p.id).order("created_at", { ascending: false }).limit(90);
      if (!own) postsQuery = postsQuery.eq("status_moderasi", "tampil");
      var postsRes = await postsQuery;
      if (postsRes.error) throw postsRes.error;
      currentPosts = postsRes.data || [];
      var sosial = p.sosial || {};
      var chips = "";
      ["instagram", "tiktok"].forEach(function (platform) {
        if (sosial[platform]) {
          chips += '<a class="social-chip" href="' + K.esc(socialUrl(sosial[platform], platform)) + '" target="_blank" rel="noopener">' + K.esc(platform === "instagram" ? "Instagram" : "TikTok") + " · " + K.esc(socialLabel(sosial[platform], platform)) + "</a>";
        }
      });
      var cover = p.cover_path ? '<img src="' + K.esc(K.mediaUrl(p.cover_path)) + '" alt="">' : "";
      var labels = K.badgeLabels(p);
      var actions = own
        ? '<div class="form-actions" style="margin-top:12px"><button class="btn plain" type="button" data-edit-open style="flex:1">Edit Profil</button><button class="btn plain" type="button" data-share-profile style="flex:1">Bagikan Profil</button></div>'
        : '<button class="profile-follow' + (followState ? " on" : "") + '" type="button" data-follow="' + (followState ? "1" : "0") + '">' + (followState ? "Mengikuti" : "Ikuti") + "</button>";
      root.innerHTML =
        '<div class="profile-cover">' + cover + "</div>" +
        '<section class="profile-card"><div class="profile-top">' + K.avatarHTML(p, "profile-avatar", ctx.session.user) +
        '<div class="profile-names"><h1>' + K.nameHTML(p) + '</h1><div class="uname">' + K.esc(K.usernameLabel(p)) + "</div></div></div>" +
        (labels.length ? '<div class="profile-badges">' + labels.map(function (b) { return '<span class="badge-pill amber">' + K.esc(b) + "</span>"; }).join("") + "</div>" : "") +
        (p.bio ? '<p class="profile-bio">' + K.esc(p.bio) + "</p>" : (own ? '<p class="profile-bio muted">Belum ada bio — tambahkan lewat Edit Profil.</p>' : "")) +
        (chips ? '<div class="social-row">' + chips + "</div>" : "") +
        '<div class="profile-stats">' +
        "<button type=\"button\" data-stat=\"postingan\"><strong>" + K.fmtNum(counts[0]) + "</strong><span>Postingan</span></button>" +
        '<button type="button" data-stat="pengikut"><strong>' + K.fmtNum(counts[1]) + "</strong><span>Pengikut</span></button>" +
        '<button type="button" data-stat="mengikuti"><strong>' + K.fmtNum(counts[2]) + "</strong><span>Mengikuti</span></button>" +
        "</div>" +
        actions +
        "</section>" +
        '<div class="prof-tabs" role="tablist" aria-label="Isi profil">' +
        '<button type="button" role="tab" data-tab="postingan" class="' + (activeTab === "postingan" ? "active" : "") + '">▦ Postingan</button>' +
        '<button type="button" role="tab" data-tab="lencana" class="' + (activeTab === "lencana" ? "active" : "") + '">★ Lencana</button>' +
        "</div>" +
        '<div id="profileTabContent">' + tabContentHTML(p, own) + "</div>";
      bindProfileActions(p, own);
    }
    function bindProfileActions(p, own) {
      root.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeTab = btn.getAttribute("data-tab");
          root.querySelectorAll("[data-tab]").forEach(function (b) { b.classList.toggle("active", b === btn); });
          document.getElementById("profileTabContent").innerHTML = tabContentHTML(p, own);
        });
      });
      root.querySelectorAll("[data-stat]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var kind = btn.getAttribute("data-stat");
          if (kind === "pengikut" || kind === "mengikuti") openFollowList(kind, p.id);
        });
      });
      var shareBtn = root.querySelector("[data-share-profile]");
      if (shareBtn) shareBtn.addEventListener("click", async function () {
        var url = new URL(K.profileLink(p), location.href).href;
        try { await navigator.clipboard.writeText(url); K.toast("Tautan profil disalin."); }
        catch (_) { window.prompt("Salin tautan profil:", url); }
      });
      var editBtn = root.querySelector("[data-edit-open]");
      if (editBtn) editBtn.addEventListener("click", function () {
        var sosial = p.sosial || {};
        document.getElementById("editNama").value = p.nama || "";
        document.getElementById("editUsername").value = p.username || "";
        document.getElementById("editBio").value = p.bio || "";
        document.getElementById("editInstagram").value = sosial.instagram || "";
        document.getElementById("editTiktok").value = sosial.tiktok || "";
        document.getElementById("editMsg").textContent = "";
        openSheet(editSheet);
      });
      var followBtn = root.querySelector("[data-follow]");
      if (followBtn) {
        followBtn.addEventListener("click", async function () {
          followBtn.disabled = true;
          try {
            var res = followBtn.getAttribute("data-follow") === "1"
              ? await c.from("follows").delete().eq("pengikut", me).eq("diikuti", p.id)
              : await c.from("follows").insert({ pengikut: me, diikuti: p.id });
            if (res.error) throw res.error;
            await loadProfile();
          } catch (err) {
            K.toast("Ikuti gagal diubah di server: " + (err.message || err));
            followBtn.disabled = false;
          }
        });
      }
    }
    var editForm = document.getElementById("editProfileForm");
    editForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      var p = currentProfile;
      if (!p || p.id !== me) return;
      var msg = document.getElementById("editMsg");
      var nama = document.getElementById("editNama").value.trim();
      var uname = document.getElementById("editUsername").value.trim().toLowerCase();
      var bio = document.getElementById("editBio").value.trim();
      var avatarFile = document.getElementById("editAvatar").files[0];
      var coverFile = document.getElementById("editCover").files[0];
      if (nama.length < 2) { msg.textContent = "Nama minimal 2 karakter."; return; }
      if (!/^[a-z0-9._]{3,24}$/.test(uname)) { msg.textContent = "Username harus 3–24 karakter: huruf kecil, angka, titik, atau garis bawah."; return; }
      var btn = editForm.querySelector('button[type="submit"]');
      btn.disabled = true; msg.textContent = "Menyimpan ke server…";
      try {
        var used = await c.from("profiles").select("id").eq("username", uname).neq("id", me).limit(1);
        if (used.error) throw used.error;
        if (used.data && used.data.length) throw new Error("Username itu sudah dipakai — coba variasi lain.");
        var sosial = Object.assign({}, p.sosial || {}, {
          instagram: document.getElementById("editInstagram").value.trim(),
          tiktok: document.getElementById("editTiktok").value.trim()
        });
        var payload = { nama: nama, username: uname, bio: bio, sosial: sosial };
        if (avatarFile) {
          if (!avatarFile.type || avatarFile.type.indexOf("image/") !== 0) throw new Error("Foto profil harus berupa gambar.");
          var avatarPath = me + "/avatar-" + Date.now() + ".jpg";
          var up = await c.storage.from("media").upload(avatarPath, avatarFile, { contentType: avatarFile.type, upsert: false });
          if (up.error) throw up.error;
          payload.avatar_path = avatarPath;
        }
        if (coverFile) {
          if (!coverFile.type || coverFile.type.indexOf("image/") !== 0) throw new Error("Foto sampul harus berupa gambar.");
          var coverPath = me + "/cover-" + Date.now() + ".jpg";
          var up2 = await c.storage.from("media").upload(coverPath, coverFile, { contentType: coverFile.type, upsert: false });
          if (up2.error) throw up2.error;
          payload.cover_path = coverPath;
        }
        var upd = await c.from("profiles").update(payload).eq("id", me);
        if (upd.error) throw upd.error;
        closeSheets();
        if (uname !== p.username) location.replace("profil.html?u=" + encodeURIComponent(uname));
        else await loadProfile();
      } catch (err) {
        msg.textContent = "Gagal menyimpan: " + (err.message || err);
        btn.disabled = false;
      }
    });

    try { await loadProfile(); }
    catch (err) {
      root.innerHTML = '<div class="empty error">Profil gagal dimuat dari server: ' + K.esc(err.message || err) + "</div>";
    }
  }
  mulai();
})();
</script>
</body>
</html>
